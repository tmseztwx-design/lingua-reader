<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17243e">
  <title>Scribe · 手机直传</title>
  <style>
    :root{--ink:#17243e;--muted:#64718a;--line:#dfe6f1;--paper:#f5f7fb;--blue:#5572cf;--green:#21816a;--gold:#d69a50}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.page{max-width:600px;margin:auto;padding:calc(28px + env(safe-area-inset-top)) 20px 42px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:30px;font-family:Georgia,serif;font-size:22px}.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px 11px 4px;background:var(--gold);color:var(--ink);font-weight:bold}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em}.card{padding:22px;margin:17px 0;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 10px 30px #17243e0c}h1{font:30px/1.18 Georgia,"Noto Serif SC",serif;margin:8px 0 11px}h2{font:20px Georgia,"Noto Serif SC",serif;margin:0 0 8px}.muted{color:var(--muted)}.warning{display:none;padding:14px;margin:15px 0;border-radius:13px;background:#fff4df;color:#745726;font-size:14px}.warning.show{display:block}.warning button{margin-top:9px;border:0;background:none;padding:0;color:#355da9;font:inherit;font-weight:700}.choice{display:block;width:100%;margin:12px 0;padding:17px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;color:var(--ink);font:inherit;font-weight:700}.choice small{display:block;margin-top:4px;color:var(--muted);font-weight:400}.choice:active{border-color:var(--blue);background:#f4f7ff}.choice input{display:none}.queue{display:grid;gap:8px;margin:16px 0}.queue:empty{display:none}.queue-item{display:grid;grid-template-columns:27px minmax(0,1fr) auto;gap:9px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.queue-number{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#edf2ff;color:#4664b7;font-size:12px;font-weight:800}.queue-copy{min-width:0}.queue-copy b,.queue-copy span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.queue-copy span{color:var(--muted);font-size:12px}.queue-actions{display:flex;gap:4px}.mini{width:29px;height:29px;padding:0;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font-size:15px}.mini[disabled]{opacity:.35}.queue-item.uploading{border-color:#aebee7;background:#f5f8ff}.queue-item.uploaded{border-color:#b5dacd;background:#f3faf7}.queue-item.error{border-color:#e5b7ae;background:#fff7f5}.action-row{display:flex;gap:10px;align-items:center;margin-top:16px}.primary{flex:1;border:0;border-radius:10px;padding:13px 15px;background:var(--ink);color:#fff;font:inherit;font-weight:800}.primary[disabled]{opacity:.55}.secondary{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;color:var(--muted);font:inherit}.privacy{padding:14px;border-radius:12px;background:#eef6f3;color:#256858;font-size:14px}.status{display:none;margin-top:16px;padding:14px;border-radius:12px;background:#f3f6fc;color:#415172}.status.show{display:block}.status b,.status span{display:block}.progress{height:7px;overflow:hidden;margin-top:10px;border-radius:20px;background:#dfe6f1}.progress i{display:block;width:0;height:100%;border-radius:inherit;background:var(--blue);transition:width .2s}.expired{display:none;text-align:center;padding:70px 10px}.expired.show{display:block}.main.expired{display:none}@media(max-width:380px){.page{padding-left:14px;padding-right:14px}.card{padding:17px}.queue-actions{gap:2px}}
  </style>
</head>
<body>
  <main class="page main" id="main">
    <div class="brand"><span class="mark">S</span> Scribe</div>
    <div class="eyebrow">手机直传</div>
    <h1 id="pageTitle">选好全部页面，再一次送到电脑</h1>
    <p class="muted" id="pageIntro">先在手机端确认页面顺序，再开始上传。桌面端会自动形成一个完整处理队列，不需要逐张导入。</p>
    <div class="warning" id="wechatWarning"><b>你已在微信中打开上传页，无需切换到系统相机。</b><br>可从相册、微信可访问的文件或“拍照加入书页”选择内容。如果微信相册单次最多选 9 张，可再选择一批加入同一个队列；全部选好后统一检查顺序，再一次上传。<span id="wifiNote"></span><br><button type="button" id="copyLink">复制备用链接（无法加载时使用）</button></div>
    <section class="card">
      <h2>选择文件</h2>
      <label class="choice">从手机相册选择全部书页<input id="images" type="file" accept="image/*,.heic,.heif" multiple><small>推荐用系统浏览器打开，支持一次多选后调整顺序</small></label>
      <label class="choice">现在拍照加入书页<input id="camera" type="file" accept="image/*" capture="environment"><small>打开手机后置摄像头；可连续拍摄多页，再统一排序和上传</small></label>
      <label class="choice">从微信或手机文件选择文献<input id="documents" type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.heic,.heif,.txt" multiple><small>适合 PDF、Word、文本或已保存到手机的图片</small></label>
      <div class="queue" id="queue"></div>
      <div class="action-row"><button class="primary" id="uploadAll" type="button" disabled>按当前顺序上传</button><button class="secondary" id="clearQueue" type="button" hidden>清空</button></div>
      <div class="status" id="status"><b id="statusTitle">准备上传</b><span id="statusText"></span><div class="progress"><i id="progress"></i></div></div>
    </section>
    <p class="privacy" id="privacyNote">文件仅通过当前 Wi‑Fi 传到这台电脑的本地学习空间；通道在上传页保持连接时续期，最长一小时无活动后失效。</p>
  </main>
  <section class="page expired" id="expired"><div class="brand"><span class="mark">S</span> Scribe</div><h1>此传输通道已失效</h1><p class="muted">请回到电脑端，重新生成一个二维码后再扫码。</p></section>
  <script>window.__scribeLinkToken = "__SCRIBE_LINK_TOKEN__";</script>
  <script type="module" src="/src/mobile-upload.js"></script>
</body>
</html>
