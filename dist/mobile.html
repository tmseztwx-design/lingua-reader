<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17243e">
  <title>Scribe · 手机直传</title>
  <style>
    :root{--ink:#17243e;--muted:#64718a;--line:#dfe6f1;--paper:#f5f7fb;--blue:#5572cf;--green:#21816a;--gold:#d69a50}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.page{max-width:600px;margin:auto;padding:calc(28px + env(safe-area-inset-top)) 20px 42px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:30px;font-family:Georgia,serif;font-size:22px}.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px 11px 4px;background:var(--gold);color:var(--ink);font-weight:bold}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em}.card{padding:22px;margin:17px 0;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 10px 30px #17243e0c}h1{font:30px/1.18 Georgia,"Noto Serif SC",serif;margin:8px 0 11px}h2{font:20px Georgia,"Noto Serif SC",serif;margin:0 0 8px}.muted{color:var(--muted)}.warning{display:none;padding:14px;margin:15px 0;border-radius:13px;background:#fff4df;color:#745726;font-size:14px}.warning.show{display:block}.warning button{margin-top:9px;border:0;background:none;padding:0;color:#355da9;font:inherit;font-weight:700}.choice{display:block;width:100%;margin:12px 0;padding:17px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;color:var(--ink);font:inherit;font-weight:700}.choice small{display:block;margin-top:4px;color:var(--muted);font-weight:400}.choice:active{border-color:var(--blue);background:#f4f7ff}.choice input{display:none}.queue{display:grid;gap:8px;margin:16px 0}.queue:empty{display:none}.queue-item{display:grid;grid-template-columns:27px minmax(0,1fr) auto;gap:9px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.queue-number{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#edf2ff;color:#4664b7;font-size:12px;font-weight:800}.queue-copy{min-width:0}.queue-copy b,.queue-copy span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.queue-copy span{color:var(--muted);font-size:12px}.queue-actions{display:flex;gap:4px}.mini{width:29px;height:29px;padding:0;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font-size:15px}.mini[disabled]{opacity:.35}.queue-item.uploading{border-color:#aebee7;background:#f5f8ff}.queue-item.uploaded{border-color:#b5dacd;background:#f3faf7}.queue-item.error{border-color:#e5b7ae;background:#fff7f5}.action-row{display:flex;gap:10px;align-items:center;margin-top:16px}.primary{flex:1;border:0;border-radius:10px;padding:13px 15px;background:var(--ink);color:#fff;font:inherit;font-weight:800}.primary[disabled]{opacity:.55}.secondary{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;color:var(--muted);font:inherit}.privacy{padding:14px;border-radius:12px;background:#eef6f3;color:#256858;font-size:14px}.status{display:none;margin-top:16px;padding:14px;border-radius:12px;background:#f3f6fc;color:#415172}.status.show{display:block}.status b,.status span{display:block}.progress{height:7px;overflow:hidden;margin-top:10px;border-radius:20px;background:#dfe6f1}.progress i{display:block;width:0;height:100%;border-radius:inherit;background:var(--blue);transition:width .2s}.expired{display:none;text-align:center;padding:70px 10px}.expired.show{display:block}.main.expired{display:none}@media(max-width:380px){.page{padding-left:14px;padding-right:14px}.card{padding:17px}.queue-actions{gap:2px}}
  </style>
</head>
<body>
  <main class="page main" id="main">
    <div class="brand"><span class="mark">S</span> Scribe</div>
    <div class="eyebrow">手机直传</div>
    <h1>选好全部页面，再一次送到电脑</h1>
    <p class="muted">先在手机端确认页面顺序，再开始上传。桌面端会自动形成一个完整处理队列，不需要逐张导入。</p>
    <div class="warning" id="wechatWarning"><b>微信通常会限制一次选择的图片数量。</b><br>请使用手机系统「相机扫码」打开同一二维码，或复制下面的链接到 Safari/Chrome 后再选图，即可直接从完整相册多选。<br><button type="button" id="copyLink">复制直传链接</button></div>
    <section class="card">
      <h2>选择文件</h2>
      <label class="choice">从手机相册选择全部书页<input id="images" type="file" accept="image/*,.heic,.heif" multiple><small>推荐用系统浏览器打开，支持一次多选后调整顺序</small></label>
      <label class="choice">从微信或手机文件选择文献<input id="documents" type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.heic,.heif" multiple><small>适合 PDF、Word 或已保存到手机的图片</small></label>
      <div class="queue" id="queue"></div>
      <div class="action-row"><button class="primary" id="uploadAll" type="button" disabled>按当前顺序上传</button><button class="secondary" id="clearQueue" type="button" hidden>清空</button></div>
      <div class="status" id="status"><b id="statusTitle">准备上传</b><span id="statusText"></span><div class="progress"><i id="progress"></i></div></div>
    </section>
    <p class="privacy">文件仅通过当前 Wi‑Fi 传到这台电脑的本地学习空间；本次通道 15 分钟后自动失效。</p>
  </main>
  <section class="page expired" id="expired"><div class="brand"><span class="mark">S</span> Scribe</div><h1>此传输通道已失效</h1><p class="muted">请回到电脑端，重新生成一个二维码后再扫码。</p></section>
  <script>
    (function(){
      var token='__SCRIBE_LINK_TOKEN__', queue=[], uploading=false, status=document.querySelector('#status'), title=document.querySelector('#statusTitle'), text=document.querySelector('#statusText'), progress=document.querySelector('#progress'), queueEl=document.querySelector('#queue'), uploadButton=document.querySelector('#uploadAll'), clearButton=document.querySelector('#clearQueue');
      function show(message, detail){status.classList.add('show');title.textContent=message;text.textContent=detail||''}
      function bytes(value){return value<1024*1024?(value/1024).toFixed(0)+' KB':(value/1024/1024).toFixed(1)+' MB'}
      function fileNameHeader(name){return btoa(unescape(encodeURIComponent(name)))}
      function unavailable(message){document.querySelector('#main').classList.add('expired');document.querySelector('#expired').classList.add('show');document.querySelector('#expired p').textContent=message}
      function render(){
        queueEl.innerHTML='';queue.forEach(function(item,index){var row=document.createElement('div');row.className='queue-item '+(item.state||'');var number=document.createElement('span');number.className='queue-number';number.textContent=index+1;var copy=document.createElement('div');copy.className='queue-copy';var name=document.createElement('b');name.textContent=item.file.name;var meta=document.createElement('span');meta.textContent=bytes(item.file.size)+(item.state==='uploaded'?' · 已送达电脑':item.state==='uploading'?' · 上传中':item.state==='error'?' · 上传失败，稍后重试':' · 等待上传');copy.append(name,meta);var actions=document.createElement('div');actions.className='queue-actions';[['↑','上移',function(){move(index,-1)}],['↓','下移',function(){move(index,1)}],['×','移除',function(){remove(index)}]].forEach(function(spec){var button=document.createElement('button');button.type='button';button.className='mini';button.textContent=spec[0];button.setAttribute('aria-label',spec[1]);button.disabled=uploading||(spec[0]==='↑'&&index===0)||(spec[0]==='↓'&&index===queue.length-1)||item.state==='uploaded';button.addEventListener('click',spec[2]);actions.appendChild(button)});row.append(number,copy,actions);queueEl.appendChild(row)});var pending=queue.filter(function(item){return item.state!=='uploaded'}).length;uploadButton.disabled=!pending||uploading;uploadButton.textContent=uploading?'正在按顺序上传…':pending?'按当前顺序上传 '+pending+' 个文件':'全部文件已送达电脑';clearButton.hidden=!queue.length||uploading;
      }
      function move(index,delta){var next=index+delta;if(next<0||next>=queue.length)return;var current=queue[index];queue[index]=queue[next];queue[next]=current;render()}
      function remove(index){queue.splice(index,1);render()}
      function addFiles(fileList){Array.from(fileList||[]).forEach(function(file){queue.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),file:file,state:''})});render();if(queue.length)show('已加入上传队列','可用 ↑ ↓ 调整页面顺序；确认后一次上传全部文件。')}
      function upload(item,order){return new Promise(function(resolve,reject){var xhr=new XMLHttpRequest();xhr.open('POST','/api/mobile-links/'+token+'/files');xhr.setRequestHeader('Content-Type',item.file.type||'application/octet-stream');xhr.setRequestHeader('X-File-Name-B64',fileNameHeader(item.file.name));xhr.setRequestHeader('X-Queue-Order',String(order));xhr.upload.onprogress=function(event){if(event.lengthComputable){var percent=Math.round(event.loaded/event.total*100);progress.style.width=percent+'%';show('正在上传第 '+(order+1)+' 页',percent+'% · '+item.file.name)}};xhr.onload=function(){if(xhr.status>=200&&xhr.status<300)return resolve();var result={};try{result=JSON.parse(xhr.responseText)}catch{}if(xhr.status===410)unavailable(result.error||'此传输通道已失效。');reject(new Error(result.error||'上传失败，请重试。'))};xhr.onerror=function(){reject(new Error('网络连接中断，请确认手机与电脑在同一 Wi‑Fi 下。'))};xhr.send(item.file)})}
      async function uploadAll(){
        uploading=true;render();var total=queue.length;for(var index=0;index<queue.length;index++){var item=queue[index];if(item.state==='uploaded')continue;item.state='uploading';progress.style.width='0%';render();try{await upload(item,index);item.state='uploaded';show('第 '+(index+1)+' / '+total+' 页已送达','将继续按你设定的顺序上传下一页。')}catch(error){item.state='error';uploading=false;render();if(!document.querySelector('#expired').classList.contains('show'))show('上传暂停',error.message);return}}uploading=false;progress.style.width='100%';render();show('全部 '+total+' 个文件已按顺序送达电脑','回到电脑端，点击一次“开始处理”即可处理整组页面。')
      }
      document.querySelector('#images').addEventListener('change',function(event){addFiles(event.target.files);event.target.value=''});document.querySelector('#documents').addEventListener('change',function(event){addFiles(event.target.files);event.target.value=''});uploadButton.addEventListener('click',uploadAll);clearButton.addEventListener('click',function(){if(uploading)return;queue=[];progress.style.width='0%';render();status.classList.remove('show')});
      if(/MicroMessenger/i.test(navigator.userAgent)){document.querySelector('#wechatWarning').classList.add('show');document.querySelector('#copyLink').addEventListener('click',function(){var value=location.href,input=document.createElement('textarea');input.value=value;document.body.appendChild(input);input.select();try{document.execCommand('copy');this.textContent='链接已复制，粘贴到系统浏览器打开'}catch(error){this.textContent='请复制地址后在系统浏览器打开'}input.remove()})}
      fetch('/api/mobile-links/'+token).then(function(response){if(response.status===410)return unavailable('此传输通道已失效，请重新扫码。');if(!response.ok)throw new Error();}).catch(function(){if(!document.querySelector('#expired').classList.contains('show'))unavailable('无法连接到电脑。请确认手机与电脑在同一 Wi‑Fi 下。')});render();
    })();
  </script>
</body>
</html>
